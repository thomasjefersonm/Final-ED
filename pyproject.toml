[project]
name = "final-ed"
version = "0.1.0"
description = "Trabalho Final - Pipeline de dados com Data Lake (MinIO), arquitetura medalhão, Spark e Delta Lake - Engenharia de Dados SATC"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3>=1.34",
    "pg8000>=1.31",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "taskipy>=1.13",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.8",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.taskipy.tasks]
up = "docker compose up -d"
down = "docker compose down"
destruir = "docker compose down -v"
logs = "docker compose logs -f minio"
testar = "python scripts/testar_ambiente.py"
airflow_up = "cd airflow && astro dev start"
airflow_down = "cd airflow && astro dev stop"
airflow_restart = "cd airflow && astro dev restart"
docs = "mkdocs serve"
build = "mkdocs build --strict"
deploy = "mkdocs gh-deploy"
