site_name: Final-ED - Eleição Presidencial 2026
site_description: Pipeline de dados com Data Lake (MinIO), arquitetura medalhão, Apache Spark e Delta Lake
site_url: https://thomasjefersonm.github.io/Final-ED/

repo_name: Final-ED
repo_url: https://github.com/thomasjefersonm/Final-ED
edit_uri: edit/main/docs/

docs_dir: docs

nav:
  - Home: index.md
  - Ambiente (Docker + MinIO): ambiente.md
  - Arquitetura medalhão: arquitetura.md

theme:
  name: material
  language: pt
  palette:
    primary: blue
    accent: light-blue
  features:
    - navigation.footer
    - navigation.tabs
    - navigation.path
    - navigation.top
    - content.code.copy
  icon:
    repo: fontawesome/brands/github

extra:
  generator: false

copyright: Engenharia de Dados · Engenharia de Software · UNISATC

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.mark
